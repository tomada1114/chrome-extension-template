name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing is inherited: every job below re-declares the scopes it needs.
permissions: {}

concurrency:
  # Superseding a pull request cancels its previous run. A push to main is
  # keyed by commit instead, so consecutive merges neither cancel one another
  # nor discard the CI record of the commit that already landed.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Package scripts call pnpm recursively, so CI installs the reviewed
      # version on PATH. No `version:` input on purpose: the action reads the
      # exact `packageManager` string from package.json, which is the single
      # place that version is written. tests/workflows.test.ts fails if a
      # workflow starts stating one again.
      #
      # It also has to run *before* setup-node: setup-node's default
      # package-manager cache resolves the pnpm store path by invoking pnpm,
      # and pnpm is only on PATH once this step has run.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

  extension:
    name: Build and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Edge runs the same Chromium build; building it here is what catches a
      # `import.meta.env.BROWSER` branch that only breaks the Edge target.
      - name: Build for Edge
        run: pnpm run build:edge

      # Reads both manifests the builds just wrote and pins the permissions a user
      # is asked to accept. It sits immediately after the builds it reads, for
      # the same reason the end-to-end suite below does: in the `test` job
      # there is no build, and giving it one would build the extension twice
      # in a single workflow.
      - name: Manifest test
        run: pnpm run test:manifest

      # Playwright's bundled Chromium plus the system libraries it links
      # against. Branded Google Chrome ignores `--load-extension`, so the suite
      # cannot run on the runner's preinstalled Chrome.
      - name: Install Chromium for Playwright
        run: pnpm run e2e:browsers

      - name: End-to-end tests
        run: pnpm run test:e2e

      # The HTML report and the traces `retain-on-failure` kept: what a reader
      # needs to see why a browser test failed without re-running it.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The single source of coverage: it is collected exactly once across the
      # whole workflow.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:coverage

      - name: Run tests without coverage
        if: matrix.os != 'ubuntu-latest'
        run: pnpm run test

      # The shipping-issues skill's Python unittest suite, against the runner's
      # own python3: no setup-python and no package, since the suite imports
      # only the standard library. `-B` in the script keeps bytecode out of the
      # skill tree, whose generated mirror would otherwise drift.
      - name: Run skill script tests
        run: pnpm run test:skills
