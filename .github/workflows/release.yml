name: Release

# A release is a pushed `v<version>` tag whose version equals package.json's,
# which is the version WXT writes into the manifest. `releasing-to-stores` owns
# the procedure: bump, tag, push, then approve the `store-submission`
# environment's deployment when the packaged build looks right.
on:
  push:
    tags: ["v*.*.*"]

# Nothing is inherited: every job below re-declares the scopes it needs.
permissions: {}

concurrency:
  # One release per tag, and a second push of the same tag never cancels the
  # first: a half-finished store submission is worse than a duplicate one,
  # which the store rejects on its own.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The store accepts any version higher than the last one, so a tag that
      # disagrees with package.json would ship a manifest version nobody
      # tagged. Refuse it before anything is built.
      - name: Check the tag names package.json's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}."
            exit 1
          fi

      # The same gates the `extension` job in ci.yml runs, against the exact
      # commit being released rather than trusting that main was green.
      - name: Build
        run: pnpm run build

      - name: Manifest test
        run: pnpm run test:manifest

      - name: Install Chromium for Playwright
        run: pnpm run e2e:browsers

      - name: End-to-end tests
        run: pnpm run test:e2e

      - name: Package for Chrome
        run: pnpm run zip

      - name: Package for Edge
        run: pnpm run zip:edge

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zips
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 30

  # Uploads the packages and submits them for review. The `store-submission`
  # environment is what holds the store credentials, and its required reviewer
  # is the human sign-off a store release needs: nothing is submitted until
  # the owner approves this job in the Actions UI. A repository that has not
  # set the store variables up yet skips the job rather than failing it, so a
  # tag still produces a GitHub release with the packages attached. The
  # identifiers are repository variables, not environment ones: a job-level
  # `if:` is evaluated before the job enters its environment, so an
  # environment-only variable would read as empty here and skip every release.
  submit:
    name: Submit to the stores
    needs: package
    if: vars.CHROME_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store-submission
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zips
          path: .output

      # Chrome Web Store API v2 with a service account; Edge Add-ons API v1.1.
      # Identifiers are repository variables and credentials are environment
      # secrets; `releasing-to-stores` lists each one and where it comes from.
      # Edge is submitted only once its product ID is configured.
      - name: Submit
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          chrome=(.output/*-chrome.zip)
          edge=(.output/*-edge.zip)
          if [ "${#chrome[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Chrome package, found ${#chrome[@]}."
            exit 1
          fi
          args=(--chrome-zip "${chrome[0]}")
          if [ -n "${EDGE_PRODUCT_ID}" ]; then
            if [ "${#edge[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one Edge package, found ${#edge[@]}."
              exit 1
            fi
            args+=(--edge-zip "${edge[0]}")
          fi
          pnpm exec wxt submit "${args[@]}"

  github-release:
    name: Publish the GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Creating a release and attaching its assets is the one write this
    # workflow makes to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zips
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" dist/*.zip --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
